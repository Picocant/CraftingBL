<div class="grid gap-6 lg:grid-cols-3">
  <div class="lg:col-span-1">
    <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-6">
      <h3 class="text-lg font-bold mb-5">Registrasi Weapon</h3>

      <div class="space-y-5">
        <div>
          <label class="block mb-2 text-sm text-zinc-400"> Nama Weapon </label>

          <select
            id="weaponCrafting"
            class="w-full rounded-xl bg-zinc-950 border border-zinc-700 px-4 py-3"
          >
            <option value="">Pilih Weapon</option>
          </select>
        </div>

        <div>
          <label class="block mb-2 text-sm text-zinc-400">
            Serial Number
          </label>

          <input
            id="weaponSerial"
            type="text"
            class="w-full rounded-xl bg-zinc-950 border border-zinc-700 px-4 py-3"
            placeholder="Masukkan Serial Number"
          />
        </div>

        <button
          id="btnSaveWeapon"
          class="w-full rounded-xl bg-red-600 hover:bg-red-700 py-3 font-semibold"
        >
          Tambah
        </button>
      </div>
    </div>
  </div>

  <div class="mb-5">
    <input
      id="searchWeaponRegistry"
      type="text"
      placeholder="Cari Weapon atau Serial Number..."
      class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3"
    />
  </div>

  <div class="lg:col-span-2">
    <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-6">
      <h3 class="text-lg font-bold mb-5">Daftar Weapon</h3>

      <div id="weaponRegistryTable">Data belum tersedia.</div>
    </div>
  </div>
</div>
