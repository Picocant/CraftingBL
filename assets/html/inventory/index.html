<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold">Inventory</h2>

      <p class="text-sm text-zinc-500">Kelola seluruh stock material.</p>
    </div>

    <div class="flex items-center gap-3">
      <input
        id="inventorySearch"
        type="text"
        placeholder="Search item..."
        class="w-72 rounded-xl bg-zinc-900 border border-zinc-800 px-4 py-2 outline-none focus:border-red-500"
      />

      <button
        id="btnAddInventory"
        class="flex items-center gap-2 rounded-xl bg-red-600 px-5 py-2.5 font-semibold transition hover:bg-red-700"
      >
        <i data-lucide="plus" class="w-4 h-4"></i>
        Tambah
      </button>
    </div>
  </div>

  <div class="grid grid-cols-12 gap-6">
    <!-- Inventory -->
    <div class="col-span-8">
      <div
        id="inventoryGrid"
        class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5"
      ></div>
    </div>

    <!-- Detail -->
    <div class="col-span-4">
      <div
        id="inventoryDetail"
        class="rounded-2xl border border-zinc-800 bg-zinc-900 p-6"
      ></div>
    </div>
  </div>
</div>
