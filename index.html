<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BLACK LINE</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body class="bg-zinc-950 text-white">
    <div class="flex h-screen overflow-hidden">
      <!-- SIDEBAR -->
      <aside
        id="sidebar"
        class="sidebar bg-zinc-900 border-r border-zinc-800 flex flex-col shrink-0"
      >
        <!-- LOGO -->
        <div class="sidebar-header border-b border-zinc-800">
          <div class="flex items-center">
            <div
              class="sidebar-logo w-11 h-11 rounded-xl bg-red-600 flex items-center justify-center shadow-lg shadow-red-600/30 shrink-0"
            >
              <i data-lucide="shield" class="w-6 h-6"></i>
            </div>

            <div class="sidebar-brand ml-4 min-w-0">
              <h1 class="text-xl font-black tracking-wide whitespace-nowrap">
                BLACK LINE
              </h1>

              <p class="text-xs text-zinc-500 whitespace-nowrap">
                Crafting Calculator
              </p>
            </div>
          </div>
        </div>

        <!-- MENU -->
        <nav class="sidebar-nav py-5">
          <div class="px-3 space-y-2">
            <button
              id="menu-overview"
              class="menu-item active"
              onclick="loadOverview()"
              title="Overview"
            >
              <i data-lucide="layout-dashboard"></i>

              <span class="menu-text"> Overview </span>
            </button>

            <button
              id="menu-calculator"
              class="menu-item"
              onclick="loadPlanner()"
              title="Production Planner"
            >
              <i data-lucide="clipboard-list"></i>

              <span class="menu-text"> Production Planner </span>
            </button>

            <button
              id="menu-transactions"
              class="menu-item"
              onclick="loadTransactions()"
              title="Transactions"
            >
              <i data-lucide="receipt-text"></i>

              <span class="menu-text"> Transactions </span>
            </button>

            <button
              id="menu-members"
              class="menu-item"
              data-access="admin"
              onclick="loadMembers()"
              title="Members"
            >
              <i data-lucide="users"></i>

              <span class="menu-text"> Members </span>
            </button>

            <button
              id="menu-activities"
              class="menu-item"
              data-access="admin"
              onclick="loadActivities()"
              title="Aktivitas Kelompok"
            >
              <i data-lucide="calendar-check-2"></i>

              <span class="menu-text"> Aktivitas </span>
            </button>

            <button
              id="menu-contributions"
              class="menu-item"
              data-access="admin"
              onclick="loadContributions()"
              title="Kontribusi Kerja"
            >
              <i data-lucide="package-plus"></i>

              <span class="menu-text"> Kontribusi </span>
            </button>

            <button
              id="menu-inventory"
              class="menu-item"
              data-access="admin"
              onclick="loadInventory()"
              title="Inventory"
            >
              <i data-lucide="package"></i>

              <span class="menu-text"> Inventory </span>
            </button>

            <button
              id="menu-weapon-registry"
              class="menu-item"
              data-access="admin"
              onclick="loadWeaponRegistry()"
              title="Weapon Registry"
            >
              <i data-lucide="shield-plus"></i>

              <span class="menu-text"> Weapon Registry </span>
            </button>

            <button
              id="menu-salary"
              class="menu-item"
              data-access="admin"
              onclick="loadSalary()"
              title="Gaji Anggota"
            >
              <i data-lucide="wallet-cards"></i>

              <span class="menu-text"> Gaji </span>
            </button>

            <button
              id="menu-points"
              class="menu-item"
              data-access="admin"
              onclick="loadPoints()"
              title="Point Anggota"
            >
              <i data-lucide="trophy"></i>

              <span class="menu-text"> Point </span>
            </button>

            <button
              id="menu-material"
              class="menu-item"
              data-access="admin"
              onclick="loadMaterials()"
              title="Materials"
            >
              <i data-lucide="boxes"></i>

              <span class="menu-text"> Materials </span>
            </button>

            <button
              id="menu-crafting"
              class="menu-item"
              data-access="admin"
              onclick="loadCraftings()"
              title="Craftings"
            >
              <i data-lucide="hammer"></i>

              <span class="menu-text"> Craftings </span>
            </button>

            <button
              id="menu-settings"
              class="menu-item"
              data-access="admin"
              onclick="loadSettings()"
              title="Settings"
            >
              <i data-lucide="settings"></i>

              <span class="menu-text"> Settings </span>
            </button>
          </div>
        </nav>

        <!-- FOOTER -->
        <div class="sidebar-footer border-t border-zinc-800">
          <div class="sidebar-footer-content">
            <div class="text-xs uppercase tracking-widest text-zinc-500">
              Version
            </div>

            <div class="mt-2 text-lg font-bold">v1.0.0</div>

            <div class="mt-3 text-xs text-zinc-600 whitespace-nowrap">
              Made with ❤️ by BLACK LINE
            </div>
          </div>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="flex-1 min-w-0 flex flex-col overflow-hidden">
        <!-- HEADER -->
        <header
          class="bg-zinc-900 border-b border-zinc-800 px-4 sm:px-6 py-4 flex items-center justify-between"
        >
          <div class="flex items-center gap-3 sm:gap-4 min-w-0">
            <!-- SIDEBAR TOGGLE -->
            <button
              id="sidebarToggle"
              onclick="toggleSidebar()"
              class="w-10 h-10 rounded-xl border border-zinc-800 bg-zinc-950 hover:bg-zinc-800 hover:border-zinc-700 flex items-center justify-center transition-all"
              title="Toggle Sidebar"
            >
              <i
                id="sidebarToggleIcon"
                data-lucide="panel-left-close"
                class="w-5 h-5"
              ></i>
            </button>

            <h2 id="pageTitle" class="text-lg sm:text-xl font-bold truncate">
              Overview
            </h2>
          </div>
          <div class="flex items-center gap-3">
            <a
              id="loginButton"
              href="login.html"
              class="hidden px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 font-semibold text-sm transition"
            >
              Login
            </a>

            <button
              id="logoutButton"
              onclick="logout()"
              class="hidden px-4 py-2 rounded-xl border border-zinc-700 bg-zinc-800 hover:bg-zinc-700 font-semibold text-sm transition"
            >
              <span class="hidden sm:inline">Logout</span>
              <i data-lucide="log-out" class="w-4 h-4 sm:hidden"></i>
            </button>
          </div>
        </header>

        <!-- CONTENT -->
        <section class="flex-1 overflow-y-auto p-3 sm:p-5 lg:p-8 min-w-0">
          <div id="app" class="min-w-0"></div>
        </section>
      </main>
    </div>

    <!-- SCRIPTS -->

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config/supabase.js"></script>

    <!-- CORE -->
    <script src="assets/js/core/auth.js"></script>
    <script src="assets/js/core/storage.js"></script>

    <!-- SERVICES -->
    <script src="assets/js/services/discord.js"></script>
    <script src="assets/js/services/discordEmbeds.js"></script>

    <!-- WORD EXPORT -->
    <script src="https://unpkg.com/docx@9.7.1/dist/index.iife.js"></script>

    <!-- MODULES -->
    <script src="assets/js/modules/member.js"></script>
    <script src="assets/js/modules/material.js"></script>
    <script src="assets/js/modules/crafting.js"></script>
    <script src="assets/js/modules/inventory.js"></script>
    <script src="assets/js/modules/planner.js"></script>
    <script src="assets/js/modules/transaction.js"></script>
    <script src="assets/js/modules/settings.js"></script>
    <script src="assets/js/modules/overview.js"></script>
    <script src="assets/js/modules/activity.js"></script>
    <script src="assets/js/modules/contribution.js"></script>
    <script src="assets/js/modules/salary.js"></script>
    <script src="assets/js/modules/points.js"></script>
    <script src="assets/js/modules/weaponRegistry.js"></script>

    <!-- APP -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
