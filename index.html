<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BLACK LINE</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body class="bg-zinc-950 text-white">
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar -->
      <aside
        class="w-80 bg-zinc-900 border-r border-zinc-800 flex flex-col shrink-0"
      >
        <!-- Logo -->
        <div class="p-6 border-b border-zinc-800">
          <div class="flex items-center gap-4">
            <div
              class="w-12 h-12 rounded-2xl bg-red-600 flex items-center justify-center shadow-lg shadow-red-600/30"
            >
              <i data-lucide="shield" class="w-7 h-7"></i>
            </div>

            <div>
              <h1 class="text-2xl font-black tracking-wide">BLACK LINE</h1>

              <p class="text-sm text-zinc-500">Crafting Calculator</p>
            </div>
          </div>
        </div>

        <!-- Menu -->
        <nav class="flex-1 px-4 py-6 space-y-2">
          <button
            id="menu-overview"
            class="menu-item active"
            onclick="loadOverview()"
          >
            <i data-lucide="layout-dashboard"></i>
            <span>Overview</span>
          </button>

          <button
            id="menu-calculator"
            class="menu-item"
            onclick="loadPlanner()"
          >
            <i data-lucide="clipboard-list"></i>
            <span>Production Planner</span>
          </button>

          <button
            id="menu-transactions"
            class="menu-item"
            onclick="loadTransactions()"
          >
            <i data-lucide="receipt-text"></i>
            <span>Transactions</span>
          </button>

          <button
            id="menu-material"
            class="menu-item"
            onclick="loadMaterials()"
          >
            <i data-lucide="boxes"></i>
            <span>Materials</span>
          </button>

          <button
            id="menu-crafting"
            class="menu-item"
            onclick="loadCraftings()"
          >
            <i data-lucide="hammer"></i>
            <span>Craftings</span>
          </button>

          <button id="menu-settings" class="menu-item" onclick="loadSettings()">
            <i data-lucide="settings"></i>
            <span>Settings</span>
          </button>
        </nav>

        <!-- Footer -->
        <div class="border-t border-zinc-800 p-5">
          <div class="text-xs uppercase tracking-widest text-zinc-500">
            Version
          </div>

          <div class="mt-2 text-lg font-bold">v1.0.0</div>

          <div class="mt-3 text-xs text-zinc-600">
            Made with ❤️ by BLACK LINE
          </div>
        </div>
      </aside>

      <!-- Main -->
      <main class="flex-1 min-w-0 flex flex-col overflow-hidden">
        <header
          class="bg-zinc-900 border-b border-zinc-800 px-8 py-5 flex items-center justify-between"
        >
          <h2 id="pageTitle" class="text-2xl font-bold">Overview</h2>
        </header>

        <section class="flex-1 overflow-y-auto p-8">
          <div id="app"></div>
        </section>
      </main>
    </div>

    <!-- Scripts -->
    <script src="assets/js/config/webhooks.js"></script>
    <script src="assets/js/core/storage.js"></script>
    <script src="assets/js/services/discord.js"></script>
    <script src="assets/js/services/discordEmbeds.js"></script>

    <script src="assets/js/modules/material.js"></script>
    <script src="assets/js/modules/crafting.js"></script>
    <script src="assets/js/modules/planner.js"></script>
    <script src="assets/js/modules/transaction.js"></script>
    <script src="assets/js/modules/settings.js"></script>
    <script src="assets/js/modules/overview.js"></script>

    <script src="assets/js/app.js"></script>
  </body>
</html>
